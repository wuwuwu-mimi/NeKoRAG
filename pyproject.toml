[project]
name = "nekorag"
version = "0.1.0"
description = "混合检索 (Dense + BM25 + RRF) + Cross-encoder 精排 + 上下文扩展的 RAG 后台服务"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115",
    "jieba>=0.42",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2",
    "typer>=0.25.1",
    "uvicorn>=0.30",
]
